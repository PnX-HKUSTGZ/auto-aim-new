classify_model: assets/tiny_resnet.onnx
yolo11_model_path: assets/yolo11.xml
yolov8_model_path: assets/yolov8.xml
yolov5_model_path: assets/yolov5.xml
device: GPU
min_confidence: 0.8
use_traditional: true

#####-----ROI-----#####
roi: 
  x: 420
  y: 50
  width: 600
  height: 600

use_roi: false

#####-----传统方法参数-----#####
threshold: 150
max_angle_error: 45 # degree
min_lightbar_ratio: 1.5
max_lightbar_ratio: 10
min_lightbar_length: 8
min_armor_ratio: 1
max_armor_ratio: 5
max_side_ratio: 1.5
max_rectangular_error: 25 # degree

#####-----tracker参数-----#####
min_detect_count: 5
max_temp_lost_count: 15
outpost_max_temp_lost_count: 75

#####-----aimer参数-----#####
yaw_offset: 7.5 # degree -2.5   改小偏右
pitch_offset: 0.7 # degree 2    改小偏下
air_resistance: 0.038 # air drag coefficient
comming_angle: 45 # degree
leaving_angle: 20 # degree
decision_speed: 7 # rad/s
high_speed_delay_time: 0.0 # s 0.07
low_speed_delay_time: 0.00 # s planner use this value 0.01
low_speed_thresh: 1.0 # rad/s 选板低速阈值（滞回退出）
high_speed_thresh: 2.0 # rad/s 选板高速阈值（滞回进入）
min_lock_hold_time: 0.15 # s 最短锁板保持时间
switch_margin: 10 # degree 新板须优于旧板的角度
pnp_max_incidence: 80 # degree, 装甲板法向与视线的最大水平夹角

#####-----shooter参数-----#####
first_tolerance: 3 # 近距离射击容差，degree
second_tolerance: 2 # 远距离射击容差，degree
judge_distance: 2 #距离判断阈值
auto_fire: true # 是否由自瞄控制射击

camera_name: "hikrobot"
exposure_ms: 2.5
gain: 16.9
vid_pid: "2bdf:0001"

# 电控四元数 q 是“初始姿态到当前姿态”的旋转，R_gimbal2world = A^T * R(q) * A。
# 换基矩阵(行列式 +1 的合法旋转矩阵):
#   gimbal X -> IMU -Y
#   gimbal Y -> IMU  X
#   gimbal Z -> IMU  Z
#   A = [ 0, 1, 0;
#        -1, 0, 0;
#         0, 0, 1]
# yaw 绕固定世界 Z、pitch 绕 gimbal 局部 X；若 pitch 方向相反，则换用 A 的转置。
R_gimbal2imubody: [0, 1, 0, -1, 0, 0, 0, 0, 1]

# 重投影误差: 0.0579px
camera_matrix: [1779.2543398022956, 0, 731.7553028507416, 0, 1777.7463661161173, 563.35056052110451, 0, 0, 1]
distort_coeffs: [-0.073284760768414711, 0.096314263937776243, -0.00032784130680585112, 0.00020110062749084662, 0]

